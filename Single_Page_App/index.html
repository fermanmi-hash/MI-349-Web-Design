
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A random dog picture generator using a public API.">
    <title>Random Dog Generator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Random Dog Generator</h1>
        <p>Discover different dog breeds and their pictures!</p>
    </header>

    <main>
        <section class="dog-container">
            <h2>Find a Dog</h2>

            <label for="breed-select">Choose a breed:</label>

            <select id="breed-select">
                <option value="random">Any Breed</option>
            </select>

            <button id="dog-button" type="button">
                Generate Dog
            </button>

            <p id="status" role="status" aria-live="polite">
                Click the button to see a dog!
            </p>

            <div class="image-container">
                <img id="dog-image"
                     src=""
                     alt="A randomly generated dog"
                     hidden>
            </div>

            <h3 id="breed-name"></h3>
        </section>
    </main>

    <footer>
        <p>Images from Dog API</p>
        <p>
            <a href="https://dog.ceo/dog-api/">
                Visit the API Website
            </a>
        </p>
    </footer>

</body>
</html>
